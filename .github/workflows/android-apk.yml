
name: Build KYTAMILIGY APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          
unzip -q KYTAMILIGY_AI_REELS_Android_Starter_v0_7.zip -d extracted


      - name: Build APK
        working-directory: extracted/KYTAMILIGY_AI_REELS
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KYTAMILIGY-debug-apk
          path: extracted/KYTAMILIGY_AI_REELS/app/build/outputs/apk/debug/app-debug.apk
